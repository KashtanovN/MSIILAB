<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор когнитивных карт</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:#18212b;background:#f1f3f5}header{padding:20px 24px;background:white;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0}main{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px}aside,article{background:white;padding:12px;border:1px solid #ddd;border-radius:8px}h2{font-size:16px;margin:0 0 12px}details{margin:0 0 10px;border:1px solid #d7dce0;border-radius:6px;padding:0 10px 10px;background:#fff}summary{font-weight:700;padding:11px 0;cursor:pointer;color:#204d70}details[open] summary{border-bottom:1px solid #e5e8eb;margin-bottom:8px}aside>details:last-child{margin-bottom:0}label{display:block;margin:10px 0 5px}input,select,button{font:inherit;padding:9px;border:1px solid #bbc1c7;border-radius:5px}input,select{width:100%}button{background:white;cursor:pointer}button:hover{background:#edf2f6}button.primary{background:#204d70;color:white}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}#status{min-height:38px;margin:10px 0;color:#234d6d}#surface{width:100%;height:auto;display:block;border:1px solid #ddd;touch-action:none}#surface .vertex{cursor:grab}#surface .vertex:active{cursor:grabbing}#surface .edge{cursor:pointer}#legend{line-height:1.7;font-size:14px;columns:2;overflow-wrap:anywhere}#selection{min-height:30px;font-size:14px;color:#52606d}#weightEdit{width:90px}@media(max-width:800px){main{grid-template-columns:1fr}#legend{columns:1}}
article.analysis{margin:12px} .scroll{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}td,th{border:1px solid #ccd1d7;padding:8px;text-align:left}th{background:#edf2f5}td input{max-width:100px}input[type=checkbox]{width:auto}.plot{width:100%;max-height:350px}article.analysis>h2{font-size:22px}.analysis p{line-height:1.6}.analysis button{margin:8px 5px 8px 0}</style>
<header><h1>Редактор когнитивных карт</h1></header>
<main><aside>
<details open><summary>Добавить вершину</summary><label for="nodeName">Название фактора</label><input id="nodeName" placeholder="Например, температура процессора" maxlength="100"><div class="actions"><button class="primary" id="addNode">Добавить вершину</button></div></details>
<details open><summary>Добавить связь</summary><label for="from">Откуда</label><select id="from"></select><label for="to">Куда</label><select id="to"></select><label for="weight">Вес (−1 … +1)</label><input id="weight" type="text" inputmode="decimal" value="0,5"><div class="actions"><button class="primary" id="addEdge">Добавить стрелку</button></div></details>
<details id="selectedDetails"><summary>Изменить или удалить</summary><div id="selection"></div><div id="nodeTools" hidden><label for="rename">Название вершины</label><input id="rename" maxlength="100"><button id="renameBtn" style="margin-top:8px">Переименовать</button></div><div id="edgeTools" hidden><label for="weightEdit">Новый вес</label><input id="weightEdit"><button id="changeWeight">Изменить</button></div><div class="actions"><button id="remove">Удалить выбранное</button></div></details>
<details><summary>Экспорт</summary><div class="actions"><button class="primary" id="pngExport">Скачать граф (PNG)</button></div></details>
<details><summary>Проект</summary><button id="saveProject">Сохранить JSON</button><label>Открыть JSON<input id="loadProject" type="file" accept=".json"></label><button id="resetPc">Исходная карта ПК</button></details></aside><article><label for="title">Название графа</label><input id="title" value="Факторы стабильной работы ПК" maxlength="160"><div class="actions"><button id="check">Проверить требования задания</button></div><div id="status" role="status" aria-live="polite"></div><svg id="surface" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" aria-label="Редактор графа"></svg><h2 style="margin-top:20px">Вершины</h2><div id="legend"></div></article></main><article class="analysis"><button id="refreshAnalysis">Обновить анализ по текущей карте</button><div id="analysis"></div></article>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let nodes=[],edges=[],selected=null,drag=null,uid=1;
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function message(s){$('status').textContent=s}
function weight(raw){let w=Number(String(raw).trim().replace(',','.'));return Number.isFinite(w)&&w!==0&&w>=-1&&w<=1?w:null}
function fmt(w){return (w>0?'+':'')+String(Number(w.toFixed(3))).replace('.',',')}
function options(){for(const id of ['from','to']){const s=$(id),v=s.value;s.replaceChildren();for(const n of nodes){const o=document.createElement('option');o.value=n.id;o.textContent=`V${n.id} — ${n.name}`;s.append(o)}if([...s.options].some(o=>o.value===v))s.value=v}}
function draw(){const svg=$('surface');svg.replaceChildren();const defs=el('defs'),m=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto-start-reverse'});m.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#111'}));defs.append(m);svg.append(defs);
for(const e of edges){const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to),dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)continue;const ux=dx/L,uy=dy/L,r=25,g=el('g',{'class':'edge','data-edge':e.id});const coords={x1:a.x+ux*r,y1:a.y+uy*r,x2:b.x-ux*(r+2),y2:b.y-uy*(r+2)};g.append(el('line',{...coords,stroke:'transparent','stroke-width':18}));g.append(el('line',{...coords,stroke:selected?.type==='edge'&&selected.id===e.id?'#276aa0':'#111','stroke-width':1.6,'stroke-dasharray':e.weight<0?'6 5':'none','marker-end':'url(#arrow)'}));const x=(a.x+b.x)/2-uy*12,y=(a.y+b.y)/2+ux*12;g.append(el('rect',{x:x-29,y:y-12,width:58,height:24,fill:'white'}));g.append(el('text',{x,y:y+5,'text-anchor':'middle','font-family':'Arial','font-size':16,fill:'#111'},fmt(e.weight)));svg.append(g)}
for(const n of nodes){const g=el('g',{'class':'vertex','data-node':n.id});g.append(el('circle',{cx:n.x,cy:n.y,r:25,fill:'white',stroke:selected?.type==='node'&&selected.id===n.id?'#276aa0':'#111','stroke-width':selected?.type==='node'&&selected.id===n.id?3:1.5}));g.append(el('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-family':'Arial','font-size':16,fill:'#111'},'V'+n.id));svg.append(g)}
$('legend').replaceChildren();for(const n of nodes){const p=document.createElement('div');p.textContent=`V${n.id} — ${n.name}`;$('legend').append(p)}}
function select(type,id){selected=type?{type,id}:null;$('nodeTools').hidden=type!=='node';$('edgeTools').hidden=type!=='edge';if(type==='node'){const n=nodes.find(n=>n.id===id);$('selection').textContent='V'+id;$('rename').value=n.name}else if(type==='edge'){const e=edges.find(e=>e.id===id);$('selection').textContent=`V${e.from} → V${e.to}`;$('weightEdit').value=fmt(e.weight)}else $('selection').textContent='';if(type)$('selectedDetails').open=true;draw()}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform($('surface').getScreenCTM().inverse())}
$('surface').addEventListener('pointerdown',e=>{const n=e.target.closest('[data-node]'),link=e.target.closest('[data-edge]');if(n){const id=Number(n.dataset.node),p=point(e),item=nodes.find(n=>n.id===id);select('node',id);drag={id,dx:item.x-p.x,dy:item.y-p.y};$('surface').setPointerCapture(e.pointerId);e.preventDefault()}else if(link)select('edge',Number(link.dataset.edge));else select(null)});
$('surface').addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),n=nodes.find(n=>n.id===drag.id);n.x=Math.max(30,Math.min(970,p.x+drag.dx));n.y=Math.max(30,Math.min(620,p.y+drag.dy));draw()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('surface').addEventListener(event,()=>drag=null);
$('addNode').onclick=()=>{const name=$('nodeName').value.trim();if(!name)return message('Введи название фактора.');const id=Math.max(0,...nodes.map(n=>n.id))+1;nodes.push({id,name,x:70+(nodes.length%6)*150,y:80+(Math.floor(nodes.length/6)%4)*150});$('nodeName').value='';options();select('node',id);message('Вершина добавлена. Перетащи её на нужное место.')};
$('addEdge').onclick=()=>{const a=Number($('from').value),b=Number($('to').value),w=weight($('weight').value);if(!a||!b)return message('Сначала добавь две вершины.');if(a===b)return message('Петли запрещены: выбери разные вершины.');if(w===null)return message('Вес должен быть от −1 до 1 и не равен нулю.');if(edges.some(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a)))return message('Между этой парой уже есть стрелка. Можно изменить её вес.');const id=uid++;edges.push({id,from:a,to:b,weight:w});select('edge',id);message('Связь добавлена.')};
$('renameBtn').onclick=()=>{if(selected?.type!=='node')return;const name=$('rename').value.trim();if(!name)return message('Название не должно быть пустым.');nodes.find(n=>n.id===selected.id).name=name;options();draw()};
$('changeWeight').onclick=()=>{if(selected?.type!=='edge')return;const w=weight($('weightEdit').value);if(w===null)return message('Нужен ненулевой вес от −1 до 1.');edges.find(e=>e.id===selected.id).weight=w;draw()};
$('remove').onclick=()=>{if(!selected)return message('Выбери вершину или стрелку.');if(selected.type==='node'){nodes=nodes.filter(n=>n.id!==selected.id);edges=edges.filter(e=>e.from!==selected.id&&e.to!==selected.id)}else edges=edges.filter(e=>e.id!==selected.id);options();select(null);message('Элемент удалён.')};
$('check').onclick=()=>{const neg=edges.filter(e=>e.weight<0).length,issues=[];if(nodes.length<10||nodes.length>15)issues.push('нужно 10–15 вершин');if(neg<2||neg>3)issues.push('нужно 2–3 отрицательные связи');for(const n of nodes){if(!edges.some(e=>e.to===n.id))issues.push(`у V${n.id} нет входа`);if(!edges.some(e=>e.from===n.id))issues.push(`у V${n.id} нет выхода`)}message(issues.length?'Проверь: '+issues.join('; ')+'.':`Все требования выполнены: ${nodes.length} вершин, ${edges.length} связей, отрицательных — ${neg}.`)};
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportSvg(){const previous=selected;selected=null;draw();const root=el('svg',{width:1500,height:Math.max(760,120+nodes.length*50),viewBox:`0 0 1500 ${Math.max(760,120+nodes.length*50)}`});root.append(el('rect',{width:'100%',height:'100%',fill:'white'}));root.append(el('text',{x:30,y:38,'font-family':'Arial','font-size':22,fill:'#111'},$('title').value));const inner=$('surface').cloneNode(true);inner.removeAttribute('id');inner.setAttribute('x','20');inner.setAttribute('y','65');inner.setAttribute('width','1000');inner.setAttribute('height','650');root.append(inner);let y=100;for(const n of nodes){const name=`V${n.id} — ${n.name}`;const lines=[];let line='';for(const word of name.split(' ')){if((line+' '+word).length>45&&line){lines.push(line);line=word}else line+=(line?' ':'')+word}lines.push(line);for(const l of lines){root.append(el('text',{x:1040,y,'font-family':'Arial','font-size':15,fill:'#111'},l));y+=19}y+=12}const h=Math.max(760,y+40);root.setAttribute('height',h);root.setAttribute('viewBox',`0 0 1500 ${h}`);selected=previous;draw();return {text:new XMLSerializer().serializeToString(root),height:h}}
$('pngExport').onclick=()=>{const result=exportSvg(),u=URL.createObjectURL(new Blob([result.text],{type:'image/svg+xml;charset=utf-8'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=3000;c.height=result.height*2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='graph.png';a.click();URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);message('Не удалось создать PNG.')};im.src=u};
nodes=[
{id:1,name:'Количество активных программ',x:65,y:290},
{id:2,name:'Загрузка процессора',x:260,y:125},
{id:3,name:'Температура процессора',x:510,y:190},
{id:4,name:'Скорость вентилятора',x:670,y:65},
{id:5,name:'Эффективность охлаждения',x:890,y:150},
{id:6,name:'Частота сбоев ПК',x:690,y:345},
{id:7,name:'Загрузка оперативной памяти',x:145,y:460},
{id:8,name:'Обращения к файлу подкачки',x:275,y:575},
{id:9,name:'Загрузка накопителя',x:590,y:590},
{id:10,name:'Время отклика программ',x:890,y:550},
{id:11,name:'Объём диагностики',x:915,y:430},
{id:12,name:'Количество выполненных корректирующих действий',x:440,y:460}
];
edges=[[1,2,.5],[2,3,.8],[3,4,.8],[4,5,.8],[5,3,-.8],[3,6,.8],[6,11,.5],[11,12,.5],[12,6,-.8],[12,1,-.5],[1,7,.5],[7,8,.8],[8,9,.5],[9,10,.8],[10,11,.5]].map(([from,to,weight],i)=>({id:i+1,from,to,weight}));
uid=16;$('title').value='Факторы стабильной работы ПК';options();$('from').value='1';$('to').value='2';draw();select(null);
'use strict';
const Analysis = (()=>{
function matrix(nodes,edges){return nodes.map(a=>nodes.map(b=>edges.find(e=>e.from===a.id&&e.to===b.id)?.weight||0))}
function cycles(A){const found=[];let visits=0;for(let start=0;start<A.length;start++){const path=[start],seen=new Set(path);function dfs(v){if(++visits>200000)throw Error('Слишком много путей для полного перебора циклов. Уменьшите плотность графа.');for(let j=start;j<A.length;j++){if(!A[v][j])continue;if(j===start){const w=path.map((v,k)=>A[v][path[(k+1)%path.length]]);found.push({path:[...path],product:w.reduce((a,b)=>a*b,1)})}else if(!seen.has(j)){seen.add(j);path.push(j);dfs(j);path.pop();seen.delete(j)}}}dfs(start)}return found}
function simulate(A,initial,q,steps){if(!Number.isInteger(steps)||steps<0||steps>100)throw Error('Количество шагов: целое число от 0 до 100.');if(initial.length!==A.length||q.length!==A.length||[...initial,...q].some(v=>!Number.isFinite(v)))throw Error('Проверьте исходные значения и импульсы.');let p=q.slice(),v=initial.map((x,i)=>x+p[i]);const P=[p],V=[v];for(let t=0;t<steps;t++){p=A.map((_,j)=>A.reduce((s,row,i)=>s+row[j]*p[i],0));v=v.map((x,i)=>x+p[i]);if([...v,...p].some(x=>!Number.isFinite(x)))throw Error('Переполнение расчёта. Уменьшите число шагов.');P.push(p);V.push(v)}return {P,V}}
// Воздействия для исходной карты ПК: программы, охлаждение, диагностика и действия.
const plans=[{name:'Комплексное обслуживание',q:{1:-1,5:1,11:1,12:1}},{name:'Разгрузка программ',q:{1:-1}},{name:'Улучшение охлаждения',q:{5:1}}];
function scenarios(nodes,A,steps=10){if(![1,5,6,11,12].every(id=>nodes.some(n=>n.id===id)))throw Error('Для сценариев ПК нужны вершины V1, V5, V6, V11, V12 исходной карты.');return ['Положительная ситуация','Негативная ситуация'].flatMap((group,g)=>plans.map((plan,k)=>{const scale=[1,-1][g],q=nodes.map(n=>(plan.q[n.id]||0)*scale);return {name:group+' №'+(k+1),description:g===0?plan.name:['Недостаточное обслуживание','Рост числа программ','Ухудшение охлаждения'][k],q,...simulate(A,Array(nodes.length).fill(0),q,steps)}}))}
return {matrix,cycles,simulate,scenarios};
})();
if(typeof module!=='undefined')module.exports=Analysis;

const analysisRoot=$('analysis');let simulation=null,analysisMatrix=[],analysisNodes=[];
const num=x=>Math.abs(x)<1e-10?'0':Number(x.toFixed(6)).toString().replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function chart(series,labels,title,threshold){const width=900,height=320,pad=45,all=series.flatMap(x=>x),min=Math.min(0,...all),max=Math.max(1e-6,...all,threshold||0),lo=min-(max-min)*.1,hi=max+(max-min)*.1;const x=i=>pad+i*(width-2*pad)/Math.max(1,series[0].length-1),y=v=>height-pad-(v-lo)/(hi-lo)*(height-2*pad),colors=['#205d9a','#b03738','#208057','#874a9b','#b17317','#007b88'];return `<svg xmlns="${NS}" viewBox="0 0 ${width} ${height}" class="plot"><rect width="100%" height="100%" fill="white"/><text x="45" y="20" font-family="Arial" font-size="14">${esc(title)}</text><path d="M45 35 V275 H855" fill="none" stroke="#777"/>`+[lo,(lo+hi)/2,hi].map(v=>`<text x="2" y="${y(v)}" font-size="11">${num(v)}</text>`).join('')+(threshold?`<path d="M45 ${y(threshold)} H855" stroke="red" stroke-dasharray="6 4"/><text x="800" y="${y(threshold)-5}">y = 1</text>`:'')+series.map((s,k)=>`<polyline fill="none" stroke="${colors[k%6]}" stroke-width="2" points="${s.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><text x="${65+k*130}" y="305" fill="${colors[k%6]}" font-size="12">${esc(labels[k])}</text>`).join('')+series[0].map((_,i)=>`<text x="${x(i)}" y="290" font-size="10">${i}</text>`).join('')+'</svg>'}
function refreshAnalysis(){try{analysisNodes=nodes.map(n=>({...n}));analysisMatrix=Analysis.matrix(nodes,edges);const cycles=Analysis.cycles(analysisMatrix),neg=cycles.filter(x=>x.product<0).length;analysisRoot.innerHTML=`<h2>Анализ текущей карты</h2><p>Матрица A: строка — источник влияния, столбец — получатель.</p><details open><summary>Матрица отношений</summary>${table(['',...nodes.map(n=>'V'+n.id)],analysisMatrix.map((row,i)=>['V'+nodes[i].id,...row.map(num)]))}<button id="matrixCsv">Скачать матрицу CSV</button></details><details open><summary>Циклы и структурная устойчивость</summary>${table(['Цикл','Произведение весов','Знак'],cycles.map(c=>[c.path.concat(c.path[0]).map(i=>'V'+nodes[i].id).join(' → '),num(c.product),c.product<0?'Отрицательный':'Положительный']))}<p>Положительных: ${cycles.length-neg}; отрицательных: ${neg}. По критерию лекции (нечётное число отрицательных циклов): ${neg%2?'структурно устойчива':'структурно неустойчива'}.</p></details><details open><summary>Импульсное моделирование</summary><p>P(t+1) = AᵀP(t); V(0) = Vисх + P(0); V(t+1) = V(t) + P(t+1). Значения — относительные изменения, не физические градусы или проценты. Ограничения диапазоном [0;1] нет.</p><div class="scroll"><table><tr><th>Вершина</th><th>Vисх</th><th>q = P(0)</th><th>На графике</th></tr>${nodes.map(n=>`<tr><td>V${n.id} — ${esc(n.name)}</td><td><input class="base" data-id="${n.id}" value="0"></td><td><input class="imp" data-id="${n.id}" value="${n.id===5?1:0}"></td><td><input type="checkbox" class="series" data-id="${n.id}" ${[3,6,10,12].includes(n.id)?'checked':''}></td></tr>`).join('')}</table></div><label>Шагов (0–100)<input id="steps" type="number" min="0" max="100" value="10"></label><button id="runImpulse">Рассчитать</button><div id="simResults"></div></details><details open><summary>Шесть графиков импульсных процессов</summary><p>Vисх = 0. Благоприятные воздействия: №1 — меньше программ, лучше охлаждение, больше диагностики и корректирующих действий; №2 — меньше программ; №3 — лучше охлаждение. Три негативные ситуации имеют противоположные знаки воздействий. Главный критерий — уменьшение V6 (частоты сбоев). После изменения смысла вершин сценарии нужно пересмотреть.</p><button id="runScenarios">Построить шесть графиков</button><div id="scenarios"></div></details>`;
$('matrixCsv').onclick=()=>csv('matrix.csv',['',...analysisNodes.map(n=>'V'+n.id)],analysisMatrix.map((r,i)=>['V'+analysisNodes[i].id,...r]));$('runImpulse').onclick=runImpulse;$('runScenarios').onclick=runScenarios;simulation=null;runImpulse();runScenarios();}catch(e){analysisRoot.textContent=e.message}}
function csv(name,head,rows){download(new Blob(['\uFEFF'+[head,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),name)}
function readNumber(input){const v=Number(input.value.trim().replace(',','.'));if(!Number.isFinite(v)||!input.value.trim())throw Error('Введите числовые значения.');return v}
function runImpulse(){try{const A=Analysis.matrix(nodes,edges);if(nodes.map(n=>n.id).join()!==analysisNodes.map(n=>n.id).join())throw Error('Состав вершин изменился. Нажмите «Обновить анализ».');analysisMatrix=A;simulation=Analysis.simulate(A,[...analysisRoot.querySelectorAll('.base')].map(readNumber),[...analysisRoot.querySelectorAll('.imp')].map(readNumber),readNumber($('steps')));showSimulation()}catch(e){$('simResults').textContent=e.message}}
function showSimulation(){const picked=[...analysisRoot.querySelectorAll('.series:checked')].map(e=>analysisNodes.findIndex(n=>n.id===Number(e.dataset.id)));const mode=$('tableMode')?.value||'V';$('simResults').innerHTML=`<label>Таблица<select id="tableMode"><option value="V">V(t)</option><option value="P">P(t)</option></select></label><button id="simCsv">Скачать таблицу CSV</button>${table(['t',...analysisNodes.map(n=>'V'+n.id)],simulation[mode].map((r,i)=>[i,...r.map(num)]))}<div id="chartPlot">${picked.length?chart(picked.map(i=>simulation.V.map(r=>r[i])),picked.map(i=>'V'+analysisNodes[i].id),'Накопленные изменения V(t)'):''}</div><button id="chartPng">Скачать график PNG</button>`;$('tableMode').value=mode;$('tableMode').onchange=showSimulation;$('simCsv').onclick=()=>csv('impulse-'+mode+'.csv',['t',...analysisNodes.map(n=>'V'+n.id)],simulation[mode].map((r,i)=>[i,...r]));$('chartPng').onclick=()=>{const svg=$('chartPlot').querySelector('svg');if(svg)pngSvg(svg,'impulse.png')};analysisRoot.querySelectorAll('.series').forEach(e=>e.onchange=showSimulation)}
function pngSvg(svg,name){svg=svg.cloneNode(true);svg.setAttribute('width','900');svg.setAttribute('height','320');const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1800;c.height=640;c.getContext('2d').drawImage(im,0,0,1800,640);const link=document.createElement('a');link.download=name;link.href=c.toDataURL('image/png');link.click();URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);message('Не удалось создать изображение графика.')};im.src=u}
function runScenarios(){try{const results=Analysis.scenarios(nodes,Analysis.matrix(nodes,edges),readNumber($('steps'))),idx=[3,6,10,12].map(id=>nodes.findIndex(n=>n.id===id)).filter(i=>i>=0),rows=results.map(r=>[r.name,r.q.map((q,i)=>q?'V'+nodes[i].id+'='+num(q):'').filter(Boolean).join('; '),...idx.map(i=>num(r.V.at(-1)[i]))]);$('scenarios').innerHTML=table(['Сценарий','Импульсы',...idx.map(i=>'V'+nodes[i].id)],rows)+'<button id="scenarioCsv">Скачать сравнение CSV</button>'+results.map((r,k)=>`<section class="scenario-result"><h3>${esc(r.name)} — ${esc(r.description)}</h3><p>Vисх = 0; шагов: ${r.V.length-1}. Импульсы: ${esc(rows[k][1])}.</p><div id="scenarioPlot${k}">${chart(idx.map(i=>r.V.map(v=>v[i])),idx.map(i=>'V'+nodes[i].id),r.name+' — V(t)')}</div><button class="scenarioPng" data-scenario="${k}">Скачать этот график PNG</button><p>Изменение частоты сбоев V6: ${num(r.V.at(-1)[nodes.findIndex(n=>n.id===6)])}. Отрицательное значение означает уменьшение частоты сбоев.</p></section>`).join('');$('scenarios').querySelectorAll('.scenarioPng').forEach(b=>b.onclick=()=>pngSvg($('scenarioPlot'+b.dataset.scenario).querySelector('svg'),'scenario-'+(Number(b.dataset.scenario)+1)+'.png'));$('scenarioCsv').onclick=()=>csv('scenarios.csv',['Сценарий','Импульсы',...idx.map(i=>'V'+nodes[i].id)],rows)}catch(e){$('scenarios').textContent=e.message}}
$('refreshAnalysis').onclick=refreshAnalysis;refreshAnalysis();

const pcOriginal=JSON.stringify({nodes,edges});
function validProject(g){return g&&Array.isArray(g.nodes)&&Array.isArray(g.edges)&&g.nodes.length<=30&&new Set(g.nodes.map(n=>n.id)).size===g.nodes.length&&g.nodes.every(n=>Number.isInteger(n.id)&&n.id>0&&typeof n.name==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y))&&g.edges.every(e=>Number.isInteger(e.id)&&g.nodes.some(n=>n.id===e.from)&&g.nodes.some(n=>n.id===e.to)&&e.from!==e.to&&Number.isFinite(e.weight)&&e.weight!==0&&Math.abs(e.weight)<=1)&&new Set(g.edges.map(e=>[e.from,e.to].sort((a,b)=>a-b).join(':'))).size===g.edges.length}
function applyProject(g){if(!validProject(g))throw Error('Неверный формат карты, веса или повторяющиеся связи.');nodes=g.nodes;edges=g.edges;uid=Math.max(0,...edges.map(e=>e.id))+1;selected=null;options();draw()}
try{const saved=JSON.parse(localStorage.getItem('pc-cognitive-lab2'));if(saved)applyProject(saved)}catch(e){}
const drawGraph=draw;draw=function(){drawGraph();try{localStorage.setItem('pc-cognitive-lab2',JSON.stringify({nodes,edges}))}catch(e){}};
$('saveProject').onclick=()=>download(new Blob([JSON.stringify({nodes,edges},null,2)],{type:'application/json'}),'pc-project.json');
$('loadProject').onchange=async e=>{try{const f=e.target.files[0];if(f){applyProject(JSON.parse(await f.text()));refreshAnalysis();message('Карта загружена.')}}catch(e){message(e.message)}finally{e.target.value=''}};
$('resetPc').onclick=()=>{if(confirm('Восстановить исходную карту ПК вместо текущей?')){applyProject(JSON.parse(pcOriginal));refreshAnalysis()}};

refreshAnalysis();

</script></html>
