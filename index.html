<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор когнитивных карт</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:#18212b;background:#f1f3f5}header{padding:20px 24px;background:white;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0}main{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px}aside,article{background:white;padding:12px;border:1px solid #ddd;border-radius:8px}h2{font-size:16px;margin:0 0 12px}details{margin:0 0 10px;border:1px solid #d7dce0;border-radius:6px;padding:0 10px 10px;background:#fff}summary{font-weight:700;padding:11px 0;cursor:pointer;color:#204d70}details[open] summary{border-bottom:1px solid #e5e8eb;margin-bottom:8px}aside>details:last-child{margin-bottom:0}label{display:block;margin:10px 0 5px}input,select,button{font:inherit;padding:9px;border:1px solid #bbc1c7;border-radius:5px}input,select{width:100%}button{background:white;cursor:pointer}button:hover{background:#edf2f6}button.primary{background:#204d70;color:white}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}#status{min-height:38px;margin:10px 0;color:#234d6d}#surface{width:100%;height:auto;display:block;border:1px solid #ddd;touch-action:none}#surface .vertex{cursor:grab}#surface .vertex:active{cursor:grabbing}#surface .edge{cursor:pointer}#legend{line-height:1.7;font-size:14px;columns:2;overflow-wrap:anywhere}#selection{min-height:30px;font-size:14px;color:#52606d}#weightEdit{width:90px}@media(max-width:800px){main{grid-template-columns:1fr}#legend{columns:1}}
</style>
<header><h1>Редактор когнитивных карт</h1></header>
<main><aside>
<details open><summary>Добавить вершину</summary><label for="nodeName">Название фактора</label><input id="nodeName" placeholder="Например, температура процессора" maxlength="100"><div class="actions"><button class="primary" id="addNode">Добавить вершину</button></div></details>
<details open><summary>Добавить связь</summary><label for="from">Откуда</label><select id="from"></select><label for="to">Куда</label><select id="to"></select><label for="weight">Вес (−1 … +1)</label><input id="weight" type="text" inputmode="decimal" value="0,5"><div class="actions"><button class="primary" id="addEdge">Добавить стрелку</button></div></details>
<details id="selectedDetails"><summary>Изменить или удалить</summary><div id="selection"></div><div id="nodeTools" hidden><label for="rename">Название вершины</label><input id="rename" maxlength="100"><button id="renameBtn" style="margin-top:8px">Переименовать</button></div><div id="edgeTools" hidden><label for="weightEdit">Новый вес</label><input id="weightEdit"><button id="changeWeight">Изменить</button></div><div class="actions"><button id="remove">Удалить выбранное</button></div></details>
<details><summary>Экспорт</summary><div class="actions"><button class="primary" id="pngExport">Скачать граф (PNG)</button></div></details>
</aside><article><label for="title">Название графа</label><input id="title" value="Факторы стабильной работы ПК" maxlength="160"><div class="actions"><button id="check">Проверить требования задания</button></div><div id="status" role="status" aria-live="polite"></div><svg id="surface" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" aria-label="Редактор графа"></svg><h2 style="margin-top:20px">Вершины</h2><div id="legend"></div></article></main>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let nodes=[],edges=[],selected=null,drag=null,uid=1;
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function message(s){$('status').textContent=s}
function weight(raw){let w=Number(String(raw).trim().replace(',','.'));return Number.isFinite(w)&&w!==0&&w>=-1&&w<=1?w:null}
function fmt(w){return (w>0?'+':'')+String(Number(w.toFixed(3))).replace('.',',')}
function options(){for(const id of ['from','to']){const s=$(id),v=s.value;s.replaceChildren();for(const n of nodes){const o=document.createElement('option');o.value=n.id;o.textContent=`V${n.id} — ${n.name}`;s.append(o)}if([...s.options].some(o=>o.value===v))s.value=v}}
function draw(){const svg=$('surface');svg.replaceChildren();const defs=el('defs'),m=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto-start-reverse'});m.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#111'}));defs.append(m);svg.append(defs);
for(const e of edges){const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to),dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)continue;const ux=dx/L,uy=dy/L,r=25,g=el('g',{'class':'edge','data-edge':e.id});const coords={x1:a.x+ux*r,y1:a.y+uy*r,x2:b.x-ux*(r+2),y2:b.y-uy*(r+2)};g.append(el('line',{...coords,stroke:'transparent','stroke-width':18}));g.append(el('line',{...coords,stroke:selected?.type==='edge'&&selected.id===e.id?'#276aa0':'#111','stroke-width':1.6,'stroke-dasharray':e.weight<0?'6 5':'none','marker-end':'url(#arrow)'}));const x=(a.x+b.x)/2-uy*12,y=(a.y+b.y)/2+ux*12;g.append(el('rect',{x:x-29,y:y-12,width:58,height:24,fill:'white'}));g.append(el('text',{x,y:y+5,'text-anchor':'middle','font-family':'Arial','font-size':16,fill:'#111'},fmt(e.weight)));svg.append(g)}
for(const n of nodes){const g=el('g',{'class':'vertex','data-node':n.id});g.append(el('circle',{cx:n.x,cy:n.y,r:25,fill:'white',stroke:selected?.type==='node'&&selected.id===n.id?'#276aa0':'#111','stroke-width':selected?.type==='node'&&selected.id===n.id?3:1.5}));g.append(el('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-family':'Arial','font-size':16,fill:'#111'},'V'+n.id));svg.append(g)}
$('legend').replaceChildren();for(const n of nodes){const p=document.createElement('div');p.textContent=`V${n.id} — ${n.name}`;$('legend').append(p)}}
function select(type,id){selected=type?{type,id}:null;$('nodeTools').hidden=type!=='node';$('edgeTools').hidden=type!=='edge';if(type==='node'){const n=nodes.find(n=>n.id===id);$('selection').textContent='V'+id;$('rename').value=n.name}else if(type==='edge'){const e=edges.find(e=>e.id===id);$('selection').textContent=`V${e.from} → V${e.to}`;$('weightEdit').value=fmt(e.weight)}else $('selection').textContent='';if(type)$('selectedDetails').open=true;draw()}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform($('surface').getScreenCTM().inverse())}
$('surface').addEventListener('pointerdown',e=>{const n=e.target.closest('[data-node]'),link=e.target.closest('[data-edge]');if(n){const id=Number(n.dataset.node),p=point(e),item=nodes.find(n=>n.id===id);select('node',id);drag={id,dx:item.x-p.x,dy:item.y-p.y};$('surface').setPointerCapture(e.pointerId);e.preventDefault()}else if(link)select('edge',Number(link.dataset.edge));else select(null)});
$('surface').addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),n=nodes.find(n=>n.id===drag.id);n.x=Math.max(30,Math.min(970,p.x+drag.dx));n.y=Math.max(30,Math.min(620,p.y+drag.dy));draw()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('surface').addEventListener(event,()=>drag=null);
$('addNode').onclick=()=>{const name=$('nodeName').value.trim();if(!name)return message('Введи название фактора.');const id=Math.max(0,...nodes.map(n=>n.id))+1;nodes.push({id,name,x:70+(nodes.length%6)*150,y:80+(Math.floor(nodes.length/6)%4)*150});$('nodeName').value='';options();select('node',id);message('Вершина добавлена. Перетащи её на нужное место.')};
$('addEdge').onclick=()=>{const a=Number($('from').value),b=Number($('to').value),w=weight($('weight').value);if(!a||!b)return message('Сначала добавь две вершины.');if(a===b)return message('Петли запрещены: выбери разные вершины.');if(w===null)return message('Вес должен быть от −1 до 1 и не равен нулю.');if(edges.some(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a)))return message('Между этой парой уже есть стрелка. Можно изменить её вес.');const id=uid++;edges.push({id,from:a,to:b,weight:w});select('edge',id);message('Связь добавлена.')};
$('renameBtn').onclick=()=>{if(selected?.type!=='node')return;const name=$('rename').value.trim();if(!name)return message('Название не должно быть пустым.');nodes.find(n=>n.id===selected.id).name=name;options();draw()};
$('changeWeight').onclick=()=>{if(selected?.type!=='edge')return;const w=weight($('weightEdit').value);if(w===null)return message('Нужен ненулевой вес от −1 до 1.');edges.find(e=>e.id===selected.id).weight=w;draw()};
$('remove').onclick=()=>{if(!selected)return message('Выбери вершину или стрелку.');if(selected.type==='node'){nodes=nodes.filter(n=>n.id!==selected.id);edges=edges.filter(e=>e.from!==selected.id&&e.to!==selected.id)}else edges=edges.filter(e=>e.id!==selected.id);options();select(null);message('Элемент удалён.')};
$('check').onclick=()=>{const neg=edges.filter(e=>e.weight<0).length,issues=[];if(nodes.length<10||nodes.length>15)issues.push('нужно 10–15 вершин');if(neg<2||neg>3)issues.push('нужно 2–3 отрицательные связи');for(const n of nodes){if(!edges.some(e=>e.to===n.id))issues.push(`у V${n.id} нет входа`);if(!edges.some(e=>e.from===n.id))issues.push(`у V${n.id} нет выхода`)}message(issues.length?'Проверь: '+issues.join('; ')+'.':`Все требования выполнены: ${nodes.length} вершин, ${edges.length} связей, отрицательных — ${neg}.`)};
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportSvg(){const previous=selected;selected=null;draw();const root=el('svg',{xmlns:NS,width:1500,height:Math.max(760,120+nodes.length*50),viewBox:`0 0 1500 ${Math.max(760,120+nodes.length*50)}`});root.append(el('rect',{width:'100%',height:'100%',fill:'white'}));root.append(el('text',{x:30,y:38,'font-family':'Arial','font-size':22,fill:'#111'},$('title').value));const inner=$('surface').cloneNode(true);inner.removeAttribute('id');inner.setAttribute('x','20');inner.setAttribute('y','65');inner.setAttribute('width','1000');inner.setAttribute('height','650');root.append(inner);let y=100;for(const n of nodes){const name=`V${n.id} — ${n.name}`;const lines=[];let line='';for(const word of name.split(' ')){if((line+' '+word).length>45&&line){lines.push(line);line=word}else line+=(line?' ':'')+word}lines.push(line);for(const l of lines){root.append(el('text',{x:1040,y,'font-family':'Arial','font-size':15,fill:'#111'},l));y+=19}y+=12}const h=Math.max(760,y+40);root.setAttribute('height',h);root.setAttribute('viewBox',`0 0 1500 ${h}`);selected=previous;draw();return {text:new XMLSerializer().serializeToString(root),height:h}}
$('pngExport').onclick=()=>{const result=exportSvg(),u=URL.createObjectURL(new Blob([result.text],{type:'image/svg+xml;charset=utf-8'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=3000;c.height=result.height*2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>{if(b)download(b,'graph.png');else message('Не удалось сохранить PNG.')})};im.onerror=()=>{URL.revokeObjectURL(u);message('Не удалось создать PNG.')};im.src=u};
nodes=[
{id:1,name:'Количество активных программ',x:65,y:290},
{id:2,name:'Загрузка процессора',x:260,y:125},
{id:3,name:'Температура процессора',x:510,y:190},
{id:4,name:'Скорость вентилятора',x:670,y:65},
{id:5,name:'Эффективность охлаждения',x:890,y:150},
{id:6,name:'Частота сбоев ПК',x:690,y:345},
{id:7,name:'Загрузка оперативной памяти',x:145,y:460},
{id:8,name:'Обращения к файлу подкачки',x:275,y:575},
{id:9,name:'Загрузка накопителя',x:590,y:590},
{id:10,name:'Время отклика программ',x:890,y:550},
{id:11,name:'Объём диагностики',x:915,y:430},
{id:12,name:'Количество выполненных корректирующих действий',x:440,y:460}
];
edges=[[1,2,.5],[2,3,.8],[3,4,.8],[4,5,.8],[5,3,-.8],[3,6,.8],[6,11,.5],[11,12,.5],[12,6,-.8],[12,1,-.5],[1,7,.5],[7,8,.8],[8,9,.5],[9,10,.8],[10,11,.5]].map(([from,to,weight],i)=>({id:i+1,from,to,weight}));
uid=16;$('title').value='Факторы стабильной работы ПК';options();$('from').value='1';$('to').value='2';draw();select(null);
</script></html>
